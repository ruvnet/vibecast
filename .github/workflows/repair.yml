name: Apply verified native browser repair
on:
  push:
    branches: ['studio/fal-directors-cut']
    paths: ['.github/workflows/repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ruvnet/vibecast' && github.ref == 'refs/heads/studio/fal-directors-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source substitutions and verify final hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path.cwd()
          p=root/'web/studio.js';text=p.read_text()
          old="""  const {id:pid,...data}=S.project;
            const saved=await api('/api/projects/'+pid,'PUT',data);S.project=saved;
            S.projects=S.projects.map(p=>p.id===pid?saved:p);return saved;"""
          new="""  if(S.saving)throw new Error('Wait for the current film save to finish.');
            const {id:pid,...data}=S.project;
            // Lock the old inspector while a structural edit is being persisted. Otherwise
            // a fast edit can target the previous shot and be replaced by the response.
            S.saving=true;
            const controls=[...document.querySelectorAll('#main input,#main textarea,#main select,#main button')].map(el=>[el,el.disabled]);
            controls.forEach(([el])=>{el.disabled=true;});
            $('#main').setAttribute('aria-busy','true');
            try {
              const saved=await api('/api/projects/'+pid,'PUT',data);S.project=saved;
              S.projects=S.projects.map(p=>p.id===pid?saved:p);return saved;
            } finally {
              controls.forEach(([el,disabled])=>{el.disabled=disabled;});
              $('#main').removeAttribute('aria-busy');S.saving=false;
            }"""
          assert text.count(old)==1
          text=text.replace(old,new)
          old="const b=event.target.closest('button, [data-view]');if(!b||b.disabled)return;"
          assert text.count(old)==1
          text=text.replace(old,"const b=event.target.closest('button, [data-view]');if(!b||b.disabled||S.saving)return;")
          p.write_text(text)
          p=root/'tests/browser_flow.py';text=p.read_text()
          old="page.locator('[data-action=\"add-shot\"]').last.click();page.wait_for_selector('#shot-title')"
          new="""page.locator('[data-action="add-shot"]').last.click()
                          # Existing inspector fields are not evidence that the asynchronous
                          # structural save finished. Wait for the new shot, not an old input.
                          expect(page.locator('.shot-entry')).to_have_count(2)
                          expect(page.locator('#shot-title')).to_have_value('Shot 02')
                          expect(page.locator('#shot-title')).to_be_enabled()"""
          assert text.count(old)==1
          text=text.replace(old,new)
          old="assert len(film['shots'])==2 and all(s['asset_id'] for s in film['shots']),film"
          new="""assert len(film['shots'])==2 and all(s['asset_id'] for s in film['shots']),film
                          assert [s['duration'] for s in film['shots']]==[5,3],film
                          assert film['shots'][1]['title']=='The discovery',film"""
          assert text.count(old)==1
          text=text.replace(old,new)
          text=text.replace("assert abs(exported['duration']-8)<.25", "assert abs(exported['duration']-8)<.25, {'duration':exported['duration'],'shots':film['shots']}")
          p.write_text(text)
          p=root/'docs/source-manifest.json';manifest=json.loads(p.read_text())
          expected={'web/studio.js':'c0f3de16f5e9306fddbe2fa0ea6b790b2c792fe06bdd55b64e04786b51ea838d','tests/browser_flow.py':'f09837b5026906eab16a6e6d81353b73a5cc3da9d041db762f6b53da19abde88'}
          for name,sha in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual==sha,(name,actual)
              manifest[name]=actual
          p.write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'.github/workflows/repair.yml').unlink()
          PY
          node --check web/studio.js
          python3 -m py_compile tests/browser_flow.py
      - name: Commit only the verified repair to this feature branch
        run: |
          test "${GITHUB_REF}" = 'refs/heads/studio/fal-directors-cut'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/studio.js tests/browser_flow.py docs/source-manifest.json .github/workflows/repair.yml
          git commit -m 'fix: protect pending film saves and await the new shot in native browser acceptance'
          git push origin HEAD:refs/heads/studio/fal-directors-cut
