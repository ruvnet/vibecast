name: Studio acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Compile and validate exact source
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path.cwd()
          for name, expected in json.loads((root/'docs/source-manifest.json').read_text()).items():
              path=root/name
              assert path.resolve().is_relative_to(root)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==expected, name
          print('Source manifest verified.')
          PY
          python -m compileall -q studio scripts tests
          node --check web/studio.js
          mkdir -p evidence
          python -m pytest tests/test_studio.py -q --junitxml=evidence/backend.xml
      - name: Native browser and real video export
        run: python tests/browser_flow.py
      - name: Control-plane benchmark
        run: python scripts/benchmark.py
      - name: Bounded RuFlo coordination
        run: bash scripts/coordinate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-acceptance-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
