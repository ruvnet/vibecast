name: Studio acceptance
on:
  pull_request:
  push:
    branches: [main, 'studio/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[delivery]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Compile and validate
        run: |
          python -m compileall -q studio scripts tests
          node --check web/studio.js
          mkdir -p evidence
          python -m pytest tests/test_studio.py -q --junitxml=evidence/backend.xml
      - name: Native browser and real video export
        run: python tests/browser_flow.py
      - name: Control-plane benchmark
        run: python scripts/benchmark.py
      - name: Bounded RuFlo coordination
        run: bash scripts/coordinate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-acceptance-evidence
          path: evidence/
          retention-days: 14
